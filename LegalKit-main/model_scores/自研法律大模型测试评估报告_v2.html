<html lang="zh-CN">
<head>

  <title>法律评测模型分数对比</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --law: #7c3aed;
      --general: #2a9d8f;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(229, 231, 235, 0.9);
    }
    .section {
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .section p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }
    .avg-chart {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      min-height: 430px;
      overflow-x: auto;
      padding: 8px 4px 0;
    }
    .avg-bar-wrap {
      flex: 0 0 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .avg-value {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    .avg-bar {
      width: 100%;
      border-radius: 10px 10px 0 0;
      min-height: 4px;
      position: relative;
    }
    .avg-label {
      width: 100%;
      font-size: 12px;
      text-align: center;
      line-height: 1.35;
      word-break: break-word;
      color: var(--text);
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .toolbar select {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      min-width: 280px;
    }
    .task-bars {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .task-row {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(320px, 1fr) max-content;
      gap: 10px;
      align-items: center;
    }
    .task-model {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }
    .task-track {
      width: 100%;
      min-width: 320px;
      height: 18px;
      background: #edf2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .task-fill {
      height: 100%;
      border-radius: 999px;
    }
    .task-meta {
      font-size: 16px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      justify-self: end;
    }
    .task-meta strong {
      color: var(--text);
      font-weight: 700;
    }
    .matrix-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    .matrix-table {
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      text-align: center;
      vertical-align: middle;
      width: 120px;
      word-break: break-word;
    }
    th {
      position: sticky;
      top: 0;
      background: #fbfcfe;
      z-index: 1;
      font-size: 13px;
    }
    td {
      font-size: 14px;
    }
    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 2;
      width: 220px;
    }
    th:first-child {
      background: #fbfcfe;
      z-index: 3;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #fff;
    }
    .muted {
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .task-row {
        grid-template-columns: 1fr;
      }
      .task-meta {
        text-align: left;
      }
    }
  </style>
</head>

      select.value = "LexEval"; // 默认选择 LexEval 数据集
      select.onchange = () => {
        renderTaskOptions();
        renderMatrixTable();
      };
    }

    function renderTaskOptions() {
      const dataset = getCurrentDataset();
      const select = document.getElementById("taskSelect");
      const options = [
        `<option value="__avg_score__">平均分对比</option>`,
        ...dataset.taskOrder.map(taskId => `<option value="${taskId}">${taskId}</option>`),
      ];
      select.innerHTML = options.join("");
      select.onchange = () => renderTaskBars(select.value);
      renderTaskBars("__avg_score__");
    }

    function renderTaskBars(taskId) {
      const dataset = getCurrentDataset();
      const rows = dataset.models.map(model => {
        const isAvgMode = taskId === "__avg_score__";
        const taskData = isAvgMode ? null : model.tasks[taskId];
        const score = isAvgMode
          ? model.avg_score
          : taskData && taskData.score !== null && taskData.score !== undefined
            ? taskData.score
            : null;
        return {
          model_name: model.model_name,
          category: model.category,
          score,
          accuracy: taskData ? taskData.accuracy : null,
        };
      }).sort((a, b) => (b.score ?? -1) - (a.score ?? -1));

      const maxScore = Math.max(...rows.map(item => item.score ?? 0), 1);
      const container = document.getElementById("taskBars");

      container.innerHTML = rows.map(item => {
        const fillWidth = item.score === null ? 0 : (item.score / maxScore) * 100;
        const color = DATA.categoryColors[item.category];
        let meta = "无数据";
        if (item.score !== null) {
          meta = taskId === "__avg_score__"
            ? `<strong>平均分: ${formatNum(item.score)}</strong>`
            : item.accuracy === null || item.accuracy === undefined
              ? `<strong>正确率: ${formatNum(item.score)}</strong>`
              : `<strong>正确率: ${formatNum(item.score)} | 准确率: ${formatNum(item.accuracy)}</strong>`;
        }

        return `
          <div class="task-row">
            <div class="task-model">${item.model_name}</div>
            <div class="task-track">
              <div class="task-fill" style="width:${fillWidth}%;background:${color}"></div>
            </div>
            <div class="task-meta">${meta}</div>
          </div>
        `;
      }).join("");
    }

    function renderMatrixTable() {
      const dataset = getCurrentDataset();
      const table = document.getElementById("matrixTable");
      table.className = "matrix-table";
      const colgroup = `
        <colgroup>
          <col style="width:220px">
          ${dataset.models.map(() => `<col style="width:90px">`).join("")}
        </colgroup>
      `;
      const header = `
        <thead>
          <tr>
            <th>Task</th>
            ${dataset.models.map(model => `
              <th>
                <div>${model.model_name}</div>
                ${model.category === "法律模型" ? `
                  <div style="margin-top:6px;">
                    <span class="pill" style="background:${DATA.categoryColors[model.category]}">${model.category}</span>
                  </div>
                ` : ``}
              </th>
            `).join("")}
          </tr>
        </thead>
      `;

      const body = `
        <tbody>
          ${dataset.taskOrder.map(taskId => `
            <tr>
              <td>${taskId}</td>
              ${dataset.models.map(model => `<td>${getCellText(model.tasks[taskId])}</td>`).join("")}
            </tr>
          `).join("")}
        </tbody>
      `;

      table.innerHTML = colgroup + header + body;
    }

    renderLegend();
    renderDatasetOptions();
    renderTaskOptions();
    renderMatrixTable();
  </script>
</body>
</html>
